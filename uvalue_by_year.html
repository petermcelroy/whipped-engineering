<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering U-Value Archive & PDF Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body class="bg-gray-100 p-4 sm:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto bg-white shadow-xl rounded-md border-t-8 border-blue-900 p-6 sm:p-10">
        <header class="flex flex-col md:flex-row justify-between items-start mb-8 border-b pb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-900 uppercase italic">Technical Standards Archive</h1>
                <p class="text-sm text-slate-500">Regulatory U-Value ($W/m^2K$) & Linear Thermal Transmittance ($\Psi$)</p>
            </div>
            <div class="flex flex-col gap-2 w-full md:w-auto">
                <input id="projectName" type="text" placeholder="Project Reference/Client Name" class="border p-2 text-sm rounded-sm">
                <button id="exportPdf" class="bg-slate-900 hover:bg-blue-800 text-white text-xs font-bold py-3 px-6 rounded-sm shadow-md transition-all">
                    GENERATE COMPLIANCE REPORT (PDF)
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 bg-slate-50 p-6 border border-slate-200">
            <div>
                <label class="block text-xs font-black mb-2 uppercase tracking-widest text-slate-600">Region</label>
                <select id="country" class="w-full border-slate-300 rounded-sm text-sm p-3 bg-white border font-semibold">
                    <option value="scotland">Scotland (Building Standards)</option>
                    <option value="england">England & Wales (Approved Doc L)</option>
                    <option value="passivhaus">International (PHI Standard)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-black mb-2 uppercase tracking-widest text-slate-600">Building Category</label>
                <select id="buildingType" class="w-full border-slate-300 rounded-sm text-sm p-3 bg-white border font-semibold">
                    <option value="domestic">Domestic / Residential</option>
                    <option value="nondomestic">Non-Domestic / Commercial</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-black mb-2 uppercase tracking-widest text-slate-600">Regulation Year</label>
                <select id="yearSet" class="w-full border-slate-300 rounded-sm text-sm p-3 bg-white border font-semibold">
                    </select>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2">
                <h2 class="text-sm font-black mb-4 uppercase flex items-center gap-2">
                    <span class="w-4 h-4 bg-blue-900"></span> Element Transmittance Targets
                </h2>
                <div class="overflow-hidden border border-slate-200">
                    <table id="uValueTable" class="min-w-full text-sm">
                        <thead class="bg-slate-100 text-slate-700">
                            <tr class="border-b border-slate-200">
                                <th class="py-4 px-4 text-left font-bold uppercase tracking-tighter">Component</th>
                                <th class="py-4 px-4 text-center font-bold bg-red-50 text-red-900 border-x">Limiting ($U_{max}$)</th>
                                <th class="py-4 px-4 text-center font-bold bg-green-50 text-green-900">Notional ($U_{target}$)</th>
                            </tr>
                        </thead>
                        <tbody id="u-table-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <div>
                <h2 class="text-sm font-black mb-4 uppercase flex items-center gap-2">
                    <span class="w-4 h-4 bg-orange-600"></span> Thermal Bridging ($\Psi$)
                </h2>
                <div class="overflow-hidden border border-slate-200">
                    <table id="psiTable" class="min-w-full text-xs">
                        <thead class="bg-slate-100">
                            <tr class="border-b border-slate-200">
                                <th class="py-4 px-4 text-left font-bold uppercase">Junction</th>
                                <th class="py-4 px-4 text-center font-bold uppercase">$\Psi$ ($W/mK$)</th>
                            </tr>
                        </thead>
                        <tbody id="psi-table-body" class="divide-y divide-slate-100 italic"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const regArchive = {
            scotland: {
                domestic: {
                    "2023": [{e:"Wall", l:0.22, n:0.15},{e:"Roof", l:0.15, n:0.12},{e:"Floor", l:0.18, n:0.12},{e:"Glazing", l:1.40, n:1.20}],
                    "2015": [{e:"Wall", l:0.25, n:0.17},{e:"Roof", l:0.20, n:0.11},{e:"Floor", l:0.22, n:0.15},{e:"Glazing", l:1.60, n:1.40}],
                    "2010": [{e:"Wall", l:0.30, n:0.19},{e:"Roof", l:0.25, n:0.13},{e:"Floor", l:0.25, n:0.15},{e:"Glazing", l:1.80, n:1.60}],
                    "2006": [{e:"Wall", l:0.30, n:0.27},{e:"Roof", l:0.25, n:0.16},{e:"Floor", l:0.25, n:0.22},{e:"Glazing", l:2.00, n:1.80}],
                    "2002": [{e:"Wall", l:0.35, n:0.30},{e:"Roof", l:0.25, n:0.20},{e:"Floor", l:0.25, n:0.25},{e:"Glazing", l:2.20, n:2.00}]
                },
                nondomestic: {
                    "2023": [{e:"Wall", l:0.25, n:0.21},{e:"Roof", l:0.15, n:0.15},{e:"Floor", l:0.18, n:0.15},{e:"Glazing", l:1.40, n:1.40}]
                }
            },
            england: {
                domestic: {
                    "2022": [{e:"Wall", l:0.26, n:0.18},{e:"Roof", l:0.16, n:0.11},{e:"Floor", l:0.18, n:0.13},{e:"Glazing", l:1.60, n:1.20}],
                    "2013": [{e:"Wall", l:0.30, n:0.18},{e:"Roof", l:0.20, n:0.13},{e:"Floor", l:0.25, n:0.13},{e:"Glazing", l:2.00, n:1.40}],
                    "2010": [{e:"Wall", l:0.30, n:0.28},{e:"Roof", l:0.20, n:0.18},{e:"Floor", l:0.25, n:0.22},{e:"Glazing", l:2.00, n:1.80}],
                    "2006": [{e:"Wall", l:0.35, n:0.30},{e:"Roof", l:0.25, n:0.20},{e:"Floor", l:0.25, n:0.22},{e:"Glazing", l:2.20, n:2.00}]
                },
                nondomestic: {
                    "2022": [{e:"Wall", l:0.26, n:0.26},{e:"Roof", l:0.18, n:0.18},{e:"Floor", l:0.18, n:0.18},{e:"Glazing", l:1.60, n:1.60}]
                }
            },
            passivhaus: {
                standard: [{e:"Opaque Shell", l:0.15, n:0.10},{e:"Glazing (Installed)", l:0.85, n:0.80},{e:"Airtightness (n50)", l:"0.6h-1", n:"0.6h-1"}]
            },
            psiValues: [
                { j: "E1: Lintel", v: 0.05 }, { j: "E3: Sill", v: 0.04 }, { j: "E5: Ground Floor", v: 0.16 }, { j: "Passivhaus Target", v: "<0.01" }
            ]
        };

        const countryEl = document.getElementById('country');
        const typeEl = document.getElementById('buildingType');
        const yearEl = document.getElementById('yearSet');

        function updateYearDropdown() {
            const country = countryEl.value;
            const type = typeEl.value;
            yearEl.innerHTML = '';
            
            if (country === 'passivhaus') {
                yearEl.innerHTML = '<option value="standard">Classic/Plus/Premium</option>';
            } else {
                const years = Object.keys(regArchive[country][type]);
                years.forEach(yr => {
                    yearEl.innerHTML += `<option value="${yr}">${yr} Standard</option>`;
                });
            }
            updateTables();
        }

        function updateTables() {
            const country = countryEl.value;
            const type = typeEl.value;
            const year = yearEl.value;
            
            let uRows = "";
            let dataSet = (country === 'passivhaus') ? regArchive.passivhaus.standard : regArchive[country][type][year];

            dataSet.forEach(row => {
                uRows += `<tr class="border-b hover:bg-slate-50 transition-all">
                    <td class="py-4 px-4 font-bold text-slate-700">${row.e}</td>
                    <td class="py-4 px-4 text-center mono text-red-700 font-bold">${row.l}</td>
                    <td class="py-4 px-4 text-center mono text-blue-900 font-black underline">${row.n}</td>
                </tr>`;
            });
            document.getElementById('u-table-body').innerHTML = uRows;

            let psiRows = "";
            regArchive.psiValues.forEach(row => {
                psiRows += `<tr class="border-b">
                    <td class="py-3 px-4">${row.j}</td>
                    <td class="py-3 px-4 text-center mono font-bold text-orange-700">${row.v}</td>
                </tr>`;
            });
            document.getElementById('psi-table-body').innerHTML = psiRows;
        }

        async function createPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const proj = document.getElementById('projectName').value || "Unspecified Project";
            
            doc.setFontSize(22);
            doc.text("TECHNICAL COMPLIANCE SUMMARY", 14, 20);
            doc.setFontSize(10);
            doc.text(`PROJECT: ${proj}`, 14, 30);
            doc.text(`REGULATION: ${countryEl.selectedOptions[0].text} (${yearEl.value})`, 14, 35);
            doc.text(`DATE: ${new Date().toLocaleDateString('en-GB')}`, 14, 40);

            doc.autoTable({ html: '#uValueTable', startY: 50, headStyles: {fillColor: [15, 23, 42]} });
            doc.autoTable({ html: '#psiTable', startY: doc.lastAutoTable.finalY + 10, headStyles: {fillColor: [194, 65, 12]} });

            doc.save(`${proj.replace(/\s+/g, '_')}_UValue_Report.pdf`);
        }

        [countryEl, typeEl, yearEl].forEach(s => s.addEventListener('change', updateYearDropdown));
        document.getElementById('exportPdf').addEventListener('click', createPDF);
        window.onload = updateYearDropdown;
    </script>
</body>
</html>
