<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional U-Value & PDF Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body class="bg-gray-50 p-6 min-h-screen">

    <div class="max-w-5xl mx-auto bg-white shadow-2xl rounded-sm border-t-4 border-slate-900 p-8">
        <header class="flex justify-between items-start mb-8 border-b pb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 uppercase tracking-tighter">Compliance Specification Tool</h1>
                <p class="text-sm text-gray-500">U-Value ($W/m^2K$) & Thermal Bridging ($\Psi$) Regulatory Framework</p>
            </div>
            <div class="text-right flex flex-col items-end gap-2">
                <span class="text-xs font-bold bg-slate-100 px-2 py-1 rounded">CIBSE REF: CODE L/S6</span>
                <button id="exportPdf" class="bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold py-2 px-4 rounded shadow-sm transition-all flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z"/><path d="M4.603 12.087a.81.81 0 0 1-.438-.42c-.195-.388-.13-.776.08-1.102.198-.307.526-.568.897-.787a7.68 7.68 0 0 1 1.487-.64c.21-.72.445-1.503.527-2.46.067-.794.026-1.566-.21-2.037a.89.89 0 0 1 .166-1.018.807.807 0 0 1 .597-.236c.25 0 .47.107.663.295.308.3.49.746.512 1.284.028.648-.15 1.352-.445 2.035.152.35.352.742.583 1.145.773.08 1.58.177 2.215.33.712.17 1.17.443 1.346.758.188.337.178.707.035 1.072a.826.826 0 0 1-.456.444.823.823 0 0 1-.564.032c-.263-.059-.57-.22-.924-.467a9.203 9.203 0 0 1-1.353-1.233 11.132 11.132 0 0 1-2.477-.333 6.697 6.697 0 0 1-1.494 1.583c-.438.332-.88.603-1.285.733-.178.058-.358.094-.533.094zM10 5.441c.02-.204.03-.398.03-.583 0-.368-.103-.59-.17-.683-.067.093-.149.346-.149.68 0 .19.01.394.03.603.066.248.11.403.14.512.04-.126.095-.275.149-.512zm-4.135 5.46c.302-.123.582-.306.918-.582a7.255 7.255 0 0 1-1.302.545c-.21.093-.339.15-.436.103-.097-.047-.132-.213-.016-.43.128-.239.406-.35.836-.103zM7.931 9.68c.407.126.85.2 1.32.253a15.406 15.406 0 0 0-.933-1.447c-.167.242-.293.535-.387.737-.153.34-.305.463-.387.546zm3.205-1.1c.165.126.321.234.47.327.301.187.526.285.647.313a.452.452 0 0 0 .285-.014c.043-.058.05-.135.05-.173 0-.05-.016-.13-.107-.252-.11-.152-.351-.318-.754-.419a4.344 4.344 0 0 0-.591-.081z"/></svg>
                    CREATE PDF
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
            <div>
                <label class="block text-xs font-bold mb-1 uppercase">Jurisdiction</label>
                <select id="country" class="w-full border-gray-300 rounded-sm text-sm p-2 bg-gray-50 border">
                    <option value="scotland">Scotland (Section 6)</option>
                    <option value="england">England (Part L 2021/23)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 uppercase">Building Type</label>
                <select id="buildingType" class="w-full border-gray-300 rounded-sm text-sm p-2 bg-gray-50 border">
                    <option value="domestic">Domestic</option>
                    <option value="nondomestic">Non-Domestic</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 uppercase">Standard Set</label>
                <select id="standardSet" class="w-full border-gray-300 rounded-sm text-sm p-2 bg-gray-50 border">
                    <option value="2023">Current Regs (2023/24)</option>
                    <option value="2015">Previous (2010-2015)</option>
                    <option value="passivhaus">Passivhaus (Classic)</option>
                </select>
            </div>
        </div>

        <div class="mb-10">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <span class="w-3 h-3 bg-blue-600 inline-block"></span> Element Heat Transfer Coefficients
            </h2>
            <div class="overflow-x-auto border border-gray-200">
                <table id="uValueTable" class="min-w-full text-sm divide-y divide-gray-200">
                    <thead class="bg-gray-100 text-gray-700">
                        <tr>
                            <th class="py-3 px-4 text-left font-bold border-r">Component</th>
                            <th class="py-3 px-4 text-center font-bold border-r bg-red-50">Limiting ($U_{max}$)</th>
                            <th class="py-3 px-4 text-center font-bold bg-green-50">Notional Target</th>
                        </tr>
                    </thead>
                    <tbody id="u-table-body" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>

        <div>
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <span class="w-3 h-3 bg-orange-500 inline-block"></span> Linear Thermal Transmittance ($\Psi$)
            </h2>
            <div class="overflow-x-auto border border-gray-200">
                <table id="psiTable" class="min-w-full text-sm divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-3 px-4 text-left font-bold border-r">Junction Type</th>
                            <th class="py-3 px-4 text-center font-bold">Value ($W/mK$)</th>
                            <th class="py-3 px-4 text-left font-bold">Standard Reference</th>
                        </tr>
                    </thead>
                    <tbody id="psi-table-body" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const data = {
            scotland: {
                domestic: {
                    "2023": [
                        { comp: "Wall", limiting: "0.22", notional: "0.15" },
                        { comp: "Roof", limiting: "0.15", notional: "0.12" },
                        { comp: "Floor", limiting: "0.18", notional: "0.12" },
                        { comp: "Windows", limiting: "1.40", notional: "1.20" }
                    ],
                    "2015": [
                        { comp: "Wall", limiting: "0.25", notional: "0.22" },
                        { comp: "Roof", limiting: "0.20", notional: "0.13" },
                        { comp: "Floor", limiting: "0.22", notional: "0.15" },
                        { comp: "Windows", limiting: "1.60", notional: "1.40" }
                    ]
                },
                nondomestic: {
                    "2023": [
                        { comp: "Wall", limiting: "0.25", notional: "0.18" },
                        { comp: "Roof", limiting: "0.15", notional: "0.15" },
                        { comp: "Floor", limiting: "0.18", notional: "0.15" },
                        { comp: "Windows", limiting: "1.40", notional: "1.40" }
                    ]
                }
            },
            england: {
                domestic: {
                    "2023": [
                        { comp: "Wall", limiting: "0.26", notional: "0.18" },
                        { comp: "Roof", limiting: "0.16", notional: "0.11" },
                        { comp: "Floor", limiting: "0.18", notional: "0.13" },
                        { comp: "Windows", limiting: "1.60", notional: "1.20" }
                    ]
                }
            },
            passivhaus: [
                { comp: "Opaque Elements", limiting: "0.15", notional: "0.10" },
                { comp: "Glazing (Installed)", limiting: "0.85", notional: "0.80" },
                { comp: "Airtightness (n50)", limiting: "0.6 ach", notional: "0.6 ach" }
            ],
            psiValues: [
                { junction: "E1: Lintel", value: "0.05", ref: "ACD Table" },
                { junction: "E3: Sill", value: "0.04", ref: "ACD Table" },
                { junction: "E5: Ground Floor", value: "0.16", ref: "Default" },
                { junction: "Passivhaus Junctions", value: "< 0.01", ref: "Thermal Bridge Free" }
            ]
        };

        function update() {
            const country = document.getElementById('country').value;
            const type = document.getElementById('buildingType').value;
            const set = document.getElementById('standardSet').value;
            
            let uRows = "";
            let selectedData = (set === 'passivhaus') ? data.passivhaus : (data[country]?.[type]?.[set] || data.scotland.domestic["2023"]);

            selectedData.forEach(row => {
                uRows += `<tr>
                    <td class="py-3 px-4 font-semibold border-r bg-gray-50 uppercase text-xs">${row.comp}</td>
                    <td class="py-3 px-4 text-center mono border-r">${row.limiting}</td>
                    <td class="py-3 px-4 text-center mono font-bold text-blue-700">${row.notional}</td>
                </tr>`;
            });
            document.getElementById('u-table-body').innerHTML = uRows;

            let psiRows = "";
            data.psiValues.forEach(row => {
                psiRows += `<tr>
                    <td class="py-3 px-4 border-r">${row.junction}</td>
                    <td class="py-3 px-4 text-center mono font-bold">${row.value}</td>
                    <td class="py-3 px-4 text-xs italic">${row.ref}</td>
                </tr>`;
            });
            document.getElementById('psi-table-body').innerHTML = psiRows;
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const country = document.getElementById('country').selectedOptions[0].text;
            const type = document.getElementById('buildingType').selectedOptions[0].text;
            const set = document.getElementById('standardSet').selectedOptions[0].text;

            // Header
            doc.setFontSize(18);
            doc.text("Compliance Specification Report", 14, 20);
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(`Jurisdiction: ${country} | Type: ${type} | Standard: ${set}`, 14, 28);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 33);

            // U-Value Table
            doc.setTextColor(0);
            doc.setFontSize(12);
            doc.text("Heat Transfer Coefficients (U-Values)", 14, 45);
            doc.autoTable({
                html: '#uValueTable',
                startY: 50,
                theme: 'grid',
                headStyles: { fillColor: [30, 41, 59] },
                columnStyles: { 1: { halign: 'center' }, 2: { halign: 'center' } }
            });

            // Thermal Bridging Table
            const finalY = doc.lastAutoTable.finalY;
            doc.text("Linear Thermal Transmittance (Psi Values)", 14, finalY + 15);
            doc.autoTable({
                html: '#psiTable',
                startY: finalY + 20,
                theme: 'striped',
                headStyles: { fillColor: [249, 115, 22] }
            });

            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            for(let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.text("CIBSE Engineering Reference Tool - Confidential Specification Record", 14, 285);
            }

            doc.save(`U-Value_Report_${country.replace(/\s+/g, '_')}.pdf`);
        }

        document.querySelectorAll('select').forEach(s => s.addEventListener('change', update));
        document.getElementById('exportPdf').addEventListener('click', generatePDF);
        window.onload = update;
    </script>
</body>
</html>
