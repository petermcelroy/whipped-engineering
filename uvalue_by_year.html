<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulatory U-Value Archive (1982-2026)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-white p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6 border-b-2 border-black pb-4">
            <h1 class="text-xl font-bold uppercase">U-Value & Psi-Value Historical Database</h1>
            <button id="exportPdf" class="bg-black text-white px-4 py-2 text-sm font-bold hover:bg-gray-800 transition-colors">CREATE PDF</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div>
                <label class="block text-xs font-bold uppercase mb-1">Region</label>
                <select id="country" class="w-full border border-black p-2 text-sm bg-gray-50">
                    <option value="scotland">Scotland (Section 6)</option>
                    <option value="england">England (Part L)</option>
                    <option value="passivhaus">Passivhaus</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase mb-1">Sector</label>
                <select id="buildingType" class="w-full border border-black p-2 text-sm bg-gray-50">
                    <option value="domestic">Domestic</option>
                    <option value="nondomestic">Non-Domestic</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase mb-1">Regulation Year</label>
                <select id="yearSet" class="w-full border border-black p-2 text-sm bg-gray-50"></select>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div>
                <h2 class="font-bold border-b border-black mb-4 uppercase text-sm">U-Values (W/m²K)</h2>
                <table id="uValueTable" class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="border-b border-black">
                            <th class="py-2">Element</th>
                            <th class="py-2 text-center">Limiting</th>
                            <th class="py-2 text-center font-bold text-blue-800">Notional</th>
                        </tr>
                    </thead>
                    <tbody id="u-table-body"></tbody>
                </table>
            </div>

            <div>
                <h2 class="font-bold border-b border-black mb-4 uppercase text-sm">Thermal Bridging (W/mK)</h2>
                <table id="psiTable" class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="border-b border-black">
                            <th class="py-2">Junction</th>
                            <th class="py-2 text-center">Psi (Ψ)</th>
                        </tr>
                    </thead>
                    <tbody id="psi-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const db = {
            scotland: {
                domestic: {
                    "2023": [{e:"Wall", l:0.22, n:0.15},{e:"Roof", l:0.15, n:0.12},{e:"Floor", l:0.18, n:0.12},{e:"Glazing", l:1.40, n:1.20}],
                    "2015": [{e:"Wall", l:0.25, n:0.17},{e:"Roof", l:0.20, n:0.11},{e:"Floor", l:0.22, n:0.15},{e:"Glazing", l:1.60, n:1.40}],
                    "2010": [{e:"Wall", l:0.30, n:0.19},{e:"Roof", l:0.25, n:0.13},{e:"Floor", l:0.25, n:0.15},{e:"Glazing", l:1.80, n:1.60}],
                    "2007": [{e:"Wall", l:0.30, n:0.27},{e:"Roof", l:0.25, n:0.16},{e:"Floor", l:0.25, n:0.22},{e:"Glazing", l:2.00, n:1.80}],
                    "1997": [{e:"Wall", l:0.45, n:0.45},{e:"Roof", l:0.25, n:0.25},{e:"Floor", l:0.45, n:0.45},{e:"Glazing", l:3.00, n:2.80}],
                    "1991": [{e:"Wall", l:0.60, n:0.60},{e:"Roof", l:0.35, n:0.35},{e:"Floor", l:0.60, n:0.60},{e:"Glazing", l:5.70, n:3.30}],
                    "1982": [{e:"Wall", l:1.00, n:1.00},{e:"Roof", l:0.60, n:0.60},{e:"Floor", l:1.00, n:1.00},{e:"Glazing", l:5.70, n:5.70}]
                },
                nondomestic: {
                    "2023": [{e:"Wall", l:0.25, n:0.21},{e:"Roof", l:0.15, n:0.15},{e:"Floor", l:0.18, n:0.15},{e:"Glazing", l:1.40, n:1.40}],
                    "2015": [{e:"Wall", l:0.27, n:0.25},{e:"Roof", l:0.20, n:0.18},{e:"Floor", l:0.22, n:0.20},{e:"Glazing", l:1.60, n:1.60}]
                }
            },
            england: {
                domestic: {
                    "2022": [{e:"Wall", l:0.26, n:0.18},{e:"Roof", l:0.16, n:0.11},{e:"Floor", l:0.18, n:0.13},{e:"Glazing", l:1.60, n:1.20}],
                    "2013": [{e:"Wall", l:0.30, n:0.18},{e:"Roof", l:0.20, n:0.13},{e:"Floor", l:0.25, n:0.13},{e:"Glazing", l:2.00, n:1.40}],
                    "2010": [{e:"Wall", l:0.30, n:0.28},{e:"Roof", l:0.20, n:0.18},{e:"Floor", l:0.25, n:0.22},{e:"Glazing", l:2.00, n:1.80}],
                    "2006": [{e:"Wall", l:0.35, n:0.30},{e:"Roof", l:0.25, n:0.20},{e:"Floor", l:0.25, n:0.22},{e:"Glazing", l:2.20, n:2.00}],
                    "2002": [{e:"Wall", l:0.35, n:0.35},{e:"Roof", l:0.25, n:0.16},{e:"Floor", l:0.25, n:0.22},{e:"Glazing", l:2.20, n:2.00}],
                    "1995": [{e:"Wall", l:0.45, n:0.45},{e:"Roof", l:0.25, n:0.25},{e:"Floor", l:0.45, n:0.45},{e:"Glazing", l:3.30, n:3.30}],
                    "1990": [{e:"Wall", l:0.60, n:0.60},{e:"Roof", l:0.35, n:0.35},{e:"Floor", l:0.60, n:0.60},{e:"Glazing", l:5.70, n:5.70}]
                },
                nondomestic: {
                    "2022": [{e:"Wall", l:0.26, n:0.26},{e:"Roof", l:0.18, n:0.18},{e:"Floor", l:0.18, n:0.18},{e:"Glazing", l:1.60, n:1.60}]
                }
            },
            passivhaus: {
                domestic: {
                    "2024": [{e:"Opaque Shell", l:0.15, n:0.10},{e:"Glazing", l:0.85, n:0.80},{e:"Airtightness", l:"0.6 ach", n:"0.6 ach"}],
                    "2015": [{e:"Opaque Shell", l:0.15, n:0.15},{e:"Glazing", l:0.85, n:0.85},{e:"Airtightness", l:"0.6 ach", n:"0.6 ach"}]
                }
            },
            psi: [
                { j: "E1: Lintel", v: 0.05 }, { j: "E3: Sill", v: 0.04 }, { j: "E5: Ground Floor", v: 0.16 }, { j: "E16: Corner", v: 0.09 }, { j: "PH Junction", v: 0.01 }
            ]
        };

        const countrySel = document.getElementById('country');
        const typeSel = document.getElementById('buildingType');
        const yearSel = document.getElementById('yearSet');

        function updateYears() {
            const country = countrySel.value;
            const type = typeSel.value;
            yearSel.innerHTML = '';
            
            // Handle cases where sector might not exist for older years
            const years = db[country] && db[country][type] ? Object.keys(db[country][type]) : [];
            
            years.sort((a, b) => b - a).forEach(y => {
                const opt = document.createElement('option');
                opt.value = y; opt.textContent = y;
                yearSel.appendChild(opt);
            });
            render();
        }

        function render() {
            const country = countrySel.value;
            const type = typeSel.value;
            const year = yearSel.value;
            const uTable = document.getElementById('u-table-body');
            const pTable = document.getElementById('psi-table-body');
            
            uTable.innerHTML = '';
            const data = db[country]?.[type]?.[year] || [];
            data.forEach(r => {
                uTable.innerHTML += `<tr class="border-b border-gray-100">
                    <td class="py-3">${r.e}</td>
                    <td class="py-3 text-center text-gray-600">${r.l}</td>
                    <td class="py-3 text-center font-bold text-blue-900">${r.n}</td>
                </tr>`;
            });

            pTable.innerHTML = '';
            db.psi.forEach(r => {
                pTable.innerHTML += `<tr class="border-b border-gray-100"><td class="py-3">${r.j}</td><td class="py-3 text-center font-mono">${r.v}</td></tr>`;
            });
        }

        async function exportPdf() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const header = `REGULATORY TARGETS: ${countrySel.options[countrySel.selectedIndex].text} (${yearSel.value})`;
            
            doc.setFontSize(12);
            doc.text(header, 14, 15);
            doc.setFontSize(8);
            doc.text(`Generated: ${new Date().toISOString().split('T')[0]} | CIBSE Compliance Tool`, 14, 20);

            doc.autoTable({ 
                html: '#uValueTable', 
                startY: 25, 
                theme: 'grid', 
                headStyles: { fillColor: 0, textColor: 255 },
                styles: { fontSize: 9 }
            });
            
            doc.autoTable({ 
                html: '#psiTable', 
                startY: doc.lastAutoTable.finalY + 10, 
                theme: 'grid', 
                headStyles: { fillColor: 50, textColor: 255 },
                styles: { fontSize: 9 }
            });

            doc.save(`U-Value_Report_${yearSel.value}.pdf`);
        }

        countrySel.addEventListener('change', updateYears);
        typeSel.addEventListener('change', updateYears);
        yearSel.addEventListener('change', render);
        document.getElementById('exportPdf').addEventListener('click', exportPdf);
        window.onload = updateYears;
    </script>
</body>
</html>
